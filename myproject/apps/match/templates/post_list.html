<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <title>맛집 매칭 게시판</title>
  {% load static %}
  <link rel="stylesheet" href="{% static 'match/style.css' %}">
</head>
<body class="container">
  <header class="header">
    <h1>맛집 매칭 게시판</h1>
    <a class="btn" href="{% url 'post_new' %}">새 글 작성</a>
  </header>

  <ul class="post-list">
    {% for p in posts %}
      <li class="post-item">
        <a class="post-link" href="{% url 'post_detail' p.pk %}">
          <b>{{ p.title }}</b>
        </a>
        <span class="menu-chip">{{ p.menu }}</span>
        <span class="meta">by {{ p.author.username }} · {{ p.created_at|date:"Y-m-d H:i" }}</span>
      </li>
    {% empty %}
      <li class="empty">아직 글이 없습니다. 첫 글을 작성해보세요!</li>
    {% endfor %}
  </ul>

  <script src="{% static 'match/script.js' %}"></script>
</body>
</html>
